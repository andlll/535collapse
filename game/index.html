<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>535 – Collapse</title>
<!-- Icone (tools/09_icons.py, dal logo del gioco) e PWA: manifest
     (schermo intero, orizzontale) e service worker (./sw.js, prima la
     rete: installabile e avviabile offline, mai una build vecchia al posto
     di quella online). -->
<link rel="icon" type="image/png" href="./icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#1b1d17">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="535">
<!-- Unico punto d'ingresso; percorsi sempre relativi, cosi' il gioco
     funziona in una sottocartella e nell'iframe dei portali. -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1d17;
               -webkit-user-select: none; user-select: none; }
  /* nascosto fino al primo fotogramma disegnato (app.js): prima e' un
     canvas opaco di 300x150 px (la misura predefinita), un rettangolo nero
     in alto a sinistra per tutto il caricamento */
  #game { display: block; position: fixed; inset: 0; cursor: default; visibility: hidden; }
  #loading { position: fixed; left: 50%; top: 50%; width: min(60vw, 480px);
             transform: translate(-50%, -50%); color: #e8e2d0;
             font: 16px/1.4 system-ui, sans-serif; text-align: center; }
  #loading-track { height: 8px; margin-top: 10px; background: #3a3d33; border-radius: 4px; overflow: hidden; }
  #loading-bar { height: 100%; width: 0; background: #c8b98a; transition: width .15s; }
  #message { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
             max-width: min(90vw, 720px); padding: 10px 16px; border-radius: 8px;
             font: 15px/1.4 system-ui, sans-serif; color: #fff; background: #4a4f3c;
             pointer-events: none; /* i clic passano al gioco sotto */ }
  #message.warning, #toast.warning { background: #8a5a12; }
  /* conferme brevi (salvataggi), in alto: non coprono gli avvisi del motore */
  #toast { position: fixed; left: 50%; top: 16px; transform: translateX(-50%);
           max-width: min(90vw, 720px); padding: 10px 16px; border-radius: 8px;
           font: 15px/1.4 system-ui, sans-serif; color: #fff; background: #4a4f3c;
           pointer-events: none; }
  #message.error { background: #8a1c12; }
  #diag { position: fixed; left: 8px; top: 8px; margin: 0; padding: 8px 10px;
          background: rgba(0, 0, 0, .72); color: #cfe8c8; border-radius: 6px;
          font: 12px/1.45 ui-monospace, monospace; white-space: pre; pointer-events: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<!-- il testo si mostra col font del gioco (domtext.js), non prima -->
<div id="loading"><div id="loading-text" style="visibility: hidden">Loading…</div><div id="loading-track"><div id="loading-bar"></div></div></div>
<div id="message" hidden></div>
<div id="toast" hidden></div>
<pre id="diag" hidden></pre>
<script type="module" src="./dist/app.js"></script>
</body>
</html>
