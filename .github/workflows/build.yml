name: Build, prove e pubblicazione

# Fase 5 (STUDIO.md §5.1). Il repo versiona la fonte (gli zip del progetto
# GameMaker, data/, src/, il motore in game/src/); atlas, maschere, scene e
# bundle sono derivati e non versionati: questa pipeline li rigenera dagli
# zip a ogni push, prova il gioco in Chromium e prepara lo zip per i
# portali. Su main pubblica il gioco su GitHub Pages (come NIMBUS,
# n_redux: deploy-pages.yml).

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # ubuntu-latest e' passato a 26.04, dove Playwright 1.56.1 non installa Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pillow (unica dipendenza della pipeline)
        run: pip install pillow

      - name: Progetto GameMaker dagli zip (tools/01)
        run: python3 tools/01_unpack.py

      # data/, src/ e animTables.js sono generati ma versionati: rigenerati
      # devono restare identici (nessuno li ha modificati a mano, e il
      # tool che li produce e' allineato ai file)
      - name: File generati e versionati allineati (tools/02, 08)
        run: |
          python3 tools/02_extract.py > /dev/null
          python3 tools/08_anim.py > /dev/null
          git diff --stat --exit-code -- data src game/src/animTables.js

      - name: Atlas, maschere, scene (tools/05-07)
        run: |
          python3 tools/05_atlas.py
          python3 tools/06_masks.py
          python3 tools/07_scene.py

      # [STUDIO.md §9.137] gli effetti sonori dai file d'origine (nuovi/audio)
      - name: Effetti sonori (tools/18)
        run: |
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          python3 tools/18_audio.py

      # STUDIO.md §9: il kit per Tiled (artefatto da scaricare) e il collaudo:
      # le room dell'autore convertite in mappe di Tiled e rilette devono
      # ridare le stesse istanze
      - name: Kit per Tiled e collaudo (tools/11, 12)
        run: |
          python3 tools/11_tiled_kit.py
          python3 tools/12_tiled_import.py --check
          # gli scenari versionati devono venire dalle mappe di mappe/
          for m in mappe/*.tmx; do python3 tools/12_tiled_import.py "$m" > /dev/null; done
          git diff --stat --exit-code -- scenari
          # [§9.118] le mappe della schermaglia: simmetriche e uguali a quelle che scrive tools/16
          python3 tools/16_schermaglia.py --check

      - uses: actions/upload-artifact@v4
        with:
          name: 535-tiled-kit
          path: build/535-tiled-kit.zip
          if-no-files-found: error

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: game/package-lock.json

      - name: Dipendenze (esbuild)
        working-directory: game
        run: npm ci

      - name: Test unitari
        working-directory: game
        run: npm test

      - name: Bundle
        working-directory: game
        run: npm run build

      - name: Zip per i portali (tools/10)
        run: python3 tools/10_zip.py

      # Playwright solo qui (non e' fra le dipendenze del progetto): le prove
      # nel browser lo trovano in game/node_modules
      - name: Playwright e Chromium
        working-directory: game
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Prove nel browser (soak, salvataggi, mischia, monastero, raccolta, fuoco, arieti, catapulte, attacco, incendi, ponte, edifici nemici, depositi, soldati sovrapposti, presidio, presidio nemico, suggerimenti, zoom, ambiente, fiumi a linee, danni, ostacoli, cantieri vicini, risorse, viaggi lunghi, soldati ammassati, mura nemiche, stealth del livello 7, anelli della pioggia, registro e replay dei comandi, ordini come comandi, partita a due, partita a due in rete, livello 5, livello 6, zip in un iframe)
        run: |
          python3 -m http.server 8123 --directory game > /dev/null 2>&1 &
          for k in $(seq 1 30); do curl -sf http://localhost:8123/index.html > /dev/null && break; sleep 1; done
          node game/test/browser/soak.mjs http://localhost:8123 3000 menu match lvl01 lvl02 lvl03 lvl04 lvl05 lvl06 sk_padus sk_urbs sk_silva sk_rivo sk_bardonis
          node game/test/browser/saves.mjs http://localhost:8123 4000 match lvl01 lvl02 lvl03 lvl04 lvl05 lvl06 sk_padus sk_urbs sk_silva sk_rivo sk_bardonis
          node game/test/browser/melee.mjs match
          node game/test/browser/monastery.mjs
          node game/test/browser/rally.mjs
          node game/test/browser/fireorder.mjs
          node game/test/browser/rams.mjs
          node game/test/browser/catapults.mjs
          node game/test/browser/attackorder.mjs
          node game/test/browser/burn.mjs
          node game/test/browser/bridge.mjs
          node game/test/browser/enemybuildings.mjs
          node game/test/browser/economy.mjs
          node game/test/browser/enemyarmy.mjs
          node game/test/browser/enemydepots.mjs
          node game/test/browser/enemydefense.mjs
          node game/test/browser/lvl04.mjs
          node game/test/browser/lvl05.mjs
          node game/test/browser/lvl06.mjs
          node game/test/browser/depot.mjs
          node game/test/browser/settle.mjs
          node game/test/browser/garrison.mjs
          node game/test/browser/enemygarrison.mjs
          node game/test/browser/hintgap.mjs
          node game/test/browser/hover.mjs
          node game/test/browser/alarms.mjs
          node game/test/browser/minimap.mjs
          node game/test/browser/zoom.mjs
          node game/test/browser/ambience.mjs
          node game/test/browser/rivers.mjs
          node game/test/browser/damage.mjs
          node game/test/browser/blocked.mjs
          node game/test/browser/sites.mjs
          node game/test/browser/buildstuck.mjs
          node game/test/browser/resources.mjs
          node game/test/browser/longmove.mjs
          node game/test/browser/crowd.mjs
          node game/test/browser/enemywalls.mjs
          node game/test/browser/stealth.mjs
          node game/test/browser/ripples.mjs
          node game/test/browser/replay.mjs
          node game/test/browser/orders.mjs lvl06
          node game/test/browser/orders.mjs match
          node game/test/browser/pvp.mjs sk_padus 5 1500
          PVP=2 node game/test/browser/replay.mjs
          # [§9.156] la partita a due in rete: canale finto (ritardo e
          # disordine), poi WebRTC vero fra due pagine, dal menu
          node game/test/browser/netfake.mjs sk_padus 7 2400
          node game/test/browser/rtc.mjs sk_padus 950
          node game/test/browser/truce.mjs sk_padus 5
          node game/test/browser/portal.mjs build/535-collapse-web.zip 1500

      # [§9.152, multiplayer, fase 1] la stessa partita (stesso seme, nessun
      # input) in Chromium, Firefox e WebKit: in ogni browser due pagine con
      # viste e opzioni grafiche diverse danno le stesse impronte, e le
      # impronte dei tre browser sono uguali fra loro
      - name: Determinismo fra browser (Chromium, Firefox, WebKit)
        run: |
          (cd game && npx playwright install --with-deps firefox webkit)
          # Firefox headless qui non ha driver GL (niente WebGL2, il gioco non
          # parte): con la finestra su Xvfb e Mesa in software (llvmpipe)
          sudo apt-get install -y -q xvfb libgl1-mesa-dri libegl-mesa0 > /dev/null
          python3 -m http.server 8124 --directory game > /dev/null 2>&1 &
          for k in $(seq 1 30); do curl -sf http://localhost:8124/index.html > /dev/null && break; sleep 1; done
          for b in chromium webkit; do BASE=http://localhost:8124 node game/test/browser/determinism.mjs sk_padus 3000 $b | tee det_$b.txt; done
          BASE=http://localhost:8124 HEADED=1 LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1920x1080x24" node game/test/browser/determinism.mjs sk_padus 3000 firefox | tee det_firefox.txt || true
          for b in chromium firefox webkit; do grep -qx ok det_$b.txt || { echo "$b: la prova non e' passata (det_$b.txt)"; exit 1; }; done
          for b in firefox webkit; do
            diff <(grep "impronte:" det_chromium.txt) <(grep "impronte:" det_$b.txt) || { echo "impronte diverse fra chromium e $b"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: 535-collapse-web
          path: build/535-collapse-web.zip
          if-no-files-found: error

      # il sito pubblicato e' lo zip dei portali, estratto
      - name: Sito per Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p build/site
          unzip -q build/535-collapse-web.zip -d build/site

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: build/site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
